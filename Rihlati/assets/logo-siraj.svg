<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">شعار فريق سراج</title>
  <defs>
    <linearGradient id="siraj-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0bd3d3"/>
    </linearGradient>
    <filter id="siraj-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="siraj-heavy" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <g transform="translate(0,-10)">
    <path d="M100 20 C80 40 70 50 70 70 L130 70 C130 50 120 40 100 20 Z" fill="none" stroke="url(#siraj-gradient)" stroke-width="4" filter="url(#siraj-glow)"/>
    <circle cx="100" cy="15" r="5" fill="#fff" filter="url(#siraj-glow)"/>
    <path d="M60 70 L140 70 L125 150 L75 150 Z" fill="none" stroke="url(#siraj-gradient)" stroke-width="4" filter="url(#siraj-glow)"/>
    <path d="M60 70 L75 150 M140 70 L125 150" stroke="#00f2fe" stroke-opacity=".3" stroke-width="2"/>
    <path d="M75 160 L125 160 L115 175 L85 175 Z" fill="url(#siraj-gradient)" filter="url(#siraj-glow)"/>
    <line x1="100" y1="150" x2="100" y2="160" stroke="url(#siraj-gradient)" stroke-width="4"/>
    <circle cx="100" cy="110" r="12" fill="#fff" filter="url(#siraj-heavy)"/>
    <path d="M100 85 L100 95 M100 125 L100 135 M75 110 L85 110 M115 110 L125 110" stroke="#fff" stroke-width="2" filter="url(#siraj-glow)"/>
  </g>
</svg>
