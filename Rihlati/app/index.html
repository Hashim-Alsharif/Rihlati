<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111a42" />
    <title>رِحلتي | رفيقك في رحلة التعلّم</title>
    <link rel="icon" href="logo-rihlati.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" data-action="view" data-value="chat" aria-label="رِحلتي">
          <img src="logo-rihlati.svg" alt="شعار تطبيق رِحلتي" />
          <span><b>رِحلتي</b><small id="brand-sub">معك، خطوة بخطوة</small></span>
        </button>
        <button type="button" id="web-user" class="web-user" data-action="view" data-value="profile" hidden></button>
        <nav class="navigation" aria-label="التنقل الرئيسي">
          <a href="/app/" id="try-app" class="nav-btn app-preview-link" aria-label="تجربة تطبيق رحلتي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg><span>تجربة التطبيق</span></a>
          <button class="nav-btn active" data-action="view" data-value="chat" id="learner-nav">رحلتي</button>
          <button class="nav-btn" data-action="view" data-value="admin" id="office-nav">بوابة المكتب</button>
          <button class="nav-btn" data-action="view" data-value="profile" id="profile-nav">حسابي</button>
          <select id="language-toggle" class="language-btn" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option><option value="fil">Filipino</option><option value="fr">Français</option><option value="am">አማርኛ</option><option value="sw">Kiswahili</option></select>
          <button class="quiet" data-action="logout" id="logout-nav">خروج</button>
        </nav>
      </header>
      <main id="app" tabindex="-1"><p class="loading">جارٍ فتح رِحلتي…</p></main>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script src="i18n.js?v=9" defer></script>
    <script src="accounts.js?v=9" defer></script>
    <script src="app.js?v=9" defer></script>
  </body>
</html>
